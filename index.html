<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Chaotentour 2027 – Countdown bis Hamburg">
<meta property="og:description" content="Wie viele Tage noch bis Hamburg?">
<title>Countdown Hamburg 2027</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
/* Layout: eine Nachtszene am Hafen – Neonschild oben, riesige Tageszahl in der Mitte, Kai-Linie unten */
:root{
  --night:#0b1026; --night2:#141a3a; --neon:#ff3d8b; --neon2:#35e0ff; --lamp:#ffd23f; --fg:#eef1ff; --muted:#9aa3d1;
  --display:"Bungee","Impact",system-ui,sans-serif; --shade:"Bungee Shade","Bungee","Impact",sans-serif;
  --body:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,var(--night2),var(--night) 70%);background-color:var(--night);color:var(--fg);font-family:var(--body);overflow-x:hidden}
.wrap{min-height:100%;box-sizing:border-box;padding-inline:16px;padding-block:28px 0;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;position:relative}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap>*{position:relative;z-index:1}
.moin{font-family:var(--body);font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--lamp);font-size:1rem}
.sign{font-family:var(--display);font-size:clamp(1.6rem,7vw,3rem);line-height:1;color:var(--fg);text-shadow:0 0 6px var(--neon),0 0 18px var(--neon),0 0 40px var(--neon);animation:flicker 5s infinite;text-wrap:balance}
.sign small{display:block;font-size:.45em;letter-spacing:.2em;color:var(--neon2);text-shadow:0 0 6px var(--neon2),0 0 20px var(--neon2);margin-top:.5em}
@keyframes flicker{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.35}}
.stage{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:8px}
.noch{font-family:var(--display);font-size:clamp(1.2rem,5vw,2rem);color:var(--muted)}
.days{font-family:var(--shade);font-size:clamp(7rem,38vw,16rem);line-height:.9;color:var(--lamp);font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(255,210,63,.35)}
.unit{font-family:var(--display);font-size:clamp(1.4rem,6vw,2.6rem);color:var(--fg)}
.pop .days{animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
.pop .noch{animation:drop .5s ease-out both}
.pop .unit{animation:drop .5s .35s ease-out both}
@keyframes pop{0%{transform:scale(.1) rotate(-12deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes drop{0%{transform:translateY(-30px);opacity:0}100%{transform:none;opacity:1}}
.clock{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cell{min-width:74px;padding:10px 8px;border:2px solid var(--neon2);border-radius:6px;box-shadow:0 0 12px rgba(53,224,255,.35) inset}
.cell b{display:block;font-family:var(--display);font-size:1.8rem;font-variant-numeric:tabular-nums;color:var(--neon2)}
.cell span{font-size:.85rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.meta{font-size:1.05rem;color:var(--muted);letter-spacing:.06em}
.meta strong{color:var(--fg)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font-family:var(--display);font-size:1rem;padding:12px 18px;border-radius:999px;border:2px solid var(--neon);background:transparent;color:var(--fg);cursor:pointer;box-shadow:0 0 14px rgba(255,61,139,.4)}
button:hover{background:rgba(255,61,139,.15)}
button:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
.spruch{max-width:30ch;min-height:2.8em;margin:0;font-size:1.35rem;font-weight:700;color:var(--lamp);text-wrap:balance}
.spruch.in{animation:drop .45s ease-out both}
.dancer{position:fixed;left:50%;bottom:0;width:150px;max-width:40vw;transform:translate(-50%,115%);z-index:5;pointer-events:none}
.dancer svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 12px rgba(255,61,139,.55))}
.dancer .kick{transform-box:view-box;transform-origin:64px 120px}
.dancer .armL{transform-box:view-box;transform-origin:48px 60px}
.dancer .armR{transform-box:view-box;transform-origin:68px 60px}
.dancer.show{animation:dance 3.6s ease-in-out both}
.dancer.show svg{animation:sway .35s .6s 8 alternate ease-in-out}
.dancer.show .kick{animation:kick .35s .6s 8 alternate ease-in-out}
.dancer.show .armL{animation:armL .35s .6s 8 alternate}
.dancer.show .armR{animation:armR .35s .6s 8 alternate}
@keyframes dance{0%{transform:translate(-50%,115%)}14%{transform:translate(-50%,-14%)}22%{transform:translate(-50%,0)}86%{transform:translate(-50%,0)}100%{transform:translate(-50%,115%)}}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes kick{from{transform:rotate(0)}to{transform:rotate(-115deg)}}
@keyframes armL{to{transform:rotate(25deg)}}
@keyframes armR{to{transform:rotate(-25deg)}}
.harbor{width:100%;max-width:900px;margin-top:auto}
.harbor svg{width:100%;height:auto;display:block}
.water{animation:wave 4s ease-in-out infinite alternate}
@keyframes wave{to{transform:translateX(-30px)}}
.party .days{animation:party 1s infinite}
@keyframes party{50%{transform:scale(1.08) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<div class="stars" aria-hidden="true"><canvas id="sky"></canvas></div>
<main class="wrap" id="app">
  <div class="moin">Moin Jungs!</div>
  <h1 class="sign">Chaotentour 2027<small>Ziel: Hamburg</small></h1>

  <div class="stage" id="stage" aria-live="polite">
    <div class="noch" id="noch">Nur noch</div>
    <div class="days" id="days">–</div>
    <div class="unit" id="unit">Tage bis Hamburg</div>
  </div>

  <div class="clock" aria-label="Restzeit">
    <div class="cell"><b id="h">00</b><span>Std</span></div>
    <div class="cell"><b id="m">00</b><span>Min</span></div>
    <div class="cell"><b id="s">00</b><span>Sek</span></div>
  </div>

  <p class="meta">Anreise <strong>Freitag, 22.01.2027</strong> · 53°33′ N 9°59′ E · <span id="weeks"></span></p>

  <div class="btns">
    <button id="again" type="button">Nochmal knallen lassen</button>  </div>
  <p class="spruch" id="spruch" role="status"></p>

  <div class="dancer" id="dancer" aria-hidden="true">
    <svg viewBox="0 0 120 210">
      <!-- Zylinder mit Feder -->
      <rect x="47" y="6" width="22" height="16" rx="2" fill="#141a3a" stroke="#35e0ff" stroke-width="1.5"/>
      <rect x="41" y="20" width="34" height="4" rx="2" fill="#141a3a" stroke="#35e0ff" stroke-width="1.5"/>
      <path d="M68 10 Q84 -2 80 18" stroke="#ff3d8b" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- Kopf -->
      <circle cx="58" cy="38" r="14" fill="#f6c9a0"/>
      <path d="M44 34 Q46 22 58 24 Q72 24 72 36 Q66 28 58 30 Q50 30 44 34Z" fill="#ffd23f"/>
      <circle cx="53" cy="37" r="1.8" fill="#141a3a"/><circle cx="63" cy="37" r="1.8" fill="#141a3a"/>
      <path d="M52 43 Q58 49 64 43" stroke="#c2185b" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="49" cy="42" r="2.5" fill="#ff3d8b" opacity=".5"/><circle cx="67" cy="42" r="2.5" fill="#ff3d8b" opacity=".5"/>
      <!-- Arme -->
      <g class="armL"><path d="M48 60 Q34 50 26 34" stroke="#f6c9a0" stroke-width="6" fill="none" stroke-linecap="round"/></g>
      <g class="armR"><path d="M68 60 Q82 50 92 36" stroke="#f6c9a0" stroke-width="6" fill="none" stroke-linecap="round"/></g>
      <!-- Oberteil -->
      <path d="M46 54 Q58 50 70 54 L72 92 L44 92 Z" fill="#35e0ff"/>
      <!-- Standbein -->
      <path d="M52 120 L50 192" stroke="#f6c9a0" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="48" cy="196" rx="9" ry="5" fill="#ff3d8b"/>
      <!-- Kickbein -->
      <g class="kick">
        <path d="M64 120 L68 190" stroke="#f6c9a0" stroke-width="7" stroke-linecap="round"/>
        <ellipse cx="70" cy="194" rx="9" ry="5" fill="#ff3d8b"/>
      </g>
      <!-- Rüschenrock -->
      <path d="M38 92 L78 92 L96 126 Q90 132 84 126 Q78 134 70 127 Q64 135 58 127 Q52 135 46 127 Q38 134 32 126 Q26 132 20 126 Z" fill="#ff3d8b"/>
      <path d="M30 118 Q58 124 88 118" stroke="#ffd23f" stroke-width="2" fill="none"/>
    </svg>
  </div>

  <div class="harbor" aria-hidden="true">
    <svg viewBox="0 0 900 170" preserveAspectRatio="xMidYMax meet">
      <!-- Elbphilharmonie-artige Wellenkrone, Kräne, Kai -->
      <g fill="#1d2550">
        <rect x="40" y="70" width="14" height="70"/><polygon points="40,70 140,70 140,76 54,76"/><rect x="120" y="76" width="2" height="30"/>
        <rect x="720" y="55" width="14" height="85"/><polygon points="720,55 840,55 840,61 734,61"/><rect x="820" y="61" width="2" height="34"/>
        <path d="M330 140 V92 Q360 70 390 88 Q420 64 450 86 Q480 60 510 84 Q540 70 570 92 V140Z"/>
        <rect x="330" y="104" width="240" height="36" fill="#232c60"/>
      </g>
      <g fill="#ffd23f" opacity=".85">
        <rect x="345" y="112" width="6" height="6"/><rect x="365" y="112" width="6" height="6"/><rect x="405" y="122" width="6" height="6"/><rect x="455" y="112" width="6" height="6"/><rect x="505" y="122" width="6" height="6"/><rect x="545" y="112" width="6" height="6"/>
      </g>
      <rect x="0" y="140" width="900" height="30" fill="#0f1640"/>
      <path class="water" d="M0 150 Q 30 144 60 150 T 120 150 T 180 150 T 240 150 T 300 150 T 360 150 T 420 150 T 480 150 T 540 150 T 600 150 T 660 150 T 720 150 T 780 150 T 840 150 T 900 150 T 960 150" stroke="#35e0ff" stroke-opacity=".5" fill="none" stroke-width="2"/>
    </svg>
  </div>
</main>

<script>
// Anreise: 22.01.2027, 00:00 Uhr deutscher Zeit (MEZ = UTC+1)
const TARGET = Date.UTC(2027,0,21,23,0,0);
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");

function calendarDays(now){
  // ganze Kalendertage in Berliner Zeit bis zum Anreisetag
  const fmt = new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Berlin",year:"numeric",month:"2-digit",day:"2-digit"});
  const [y,m,d] = fmt.format(now).split("-").map(Number);
  return Math.round((Date.UTC(2027,0,22) - Date.UTC(y,m-1,d)) / 86400000);
}

function render(){
  const now = new Date();
  const diff = TARGET - now.getTime();
  const days = calendarDays(now);
  const app = $("app");
  if (diff <= 0){
    $("noch").textContent = days === 0 ? "Heute ist es so weit!" : "Wir sind da!";
    $("days").textContent = "0";
    $("unit").textContent = "Ab nach Hamburg!";
    app.classList.add("party");
    ["h","m","s"].forEach(k => $(k).textContent = "00");
    $("weeks").textContent = "Leinen los!";
    return;
  }
  $("days").textContent = days;
  $("noch").textContent = days === 1 ? "Morgen!" : "Nur noch";
  $("unit").textContent = days === 1 ? "Tag bis Hamburg" : "Tage bis Hamburg";
  const h = Math.floor(diff/3600000)%24, m = Math.floor(diff/60000)%60, s = Math.floor(diff/1000)%60;
  $("h").textContent = pad(h); $("m").textContent = pad(m); $("s").textContent = pad(s);
  const w = Math.floor(days/7), r = days%7;
  $("weeks").textContent = w ? `${w} Wochen${r ? " und " + r + (r===1?" Tag":" Tage") : ""}` : "letzte Woche!";
}

const SPRUECHE = [
  "Was in Hamburg passiert, bleibt in Hamburg.",
  "Hamburg, mach dich warm – die Chaoten kommen!",
  "Packliste: Ausweis, Ladekabel, Kopfschmerztabletten.",
  "Wer zuerst schläft, zahlt die erste Runde.",
  "Ebbe im Portemonnaie, Flut an Laune.",
  "Moin reicht. Moin Moin ist schon Gesabbel.",
  "Chaoten an Bord – Vernunft bleibt an Land.",
  "Die Elbe wartet nicht. Wir auch nicht.",
  "Schlafen können wir zu Hause.",
  "Wer's Handy verliert, gibt 'ne Runde aus.",
  "Einer für alle, alle an die Theke!",
  "Treffpunkt Landungsbrücken. Uhrzeit: ungefähr."
];
let lastSpruch = -1;
function showSpruch(i){
  if (i === undefined){ do { i = Math.floor(Math.random()*SPRUECHE.length); } while (i === lastSpruch && SPRUECHE.length > 1); }
  lastSpruch = i;
  const el = $("spruch");
  el.textContent = "„" + SPRUECHE[i] + "“";
  el.classList.remove("in"); void el.offsetWidth; el.classList.add("in");
}

function dance(){
  const d = $("dancer");
  d.classList.remove("show"); void d.offsetWidth; d.classList.add("show");
}

function boom(){
  const st = $("stage");
  st.classList.remove("pop"); void st.offsetWidth; st.classList.add("pop");
  confetti();
  setTimeout(dance, 300);
}

// Konfetti in Neonfarben
const cv = $("sky"), cx = cv.getContext("2d");
let parts = [], stars = [];
function size(){ cv.width = innerWidth; cv.height = innerHeight; stars = Array.from({length:70},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height*.6,r:Math.random()*1.4+.3,t:Math.random()*6})); }
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols=["#ff3d8b","#35e0ff","#ffd23f","#eef1ff"];
  for(let i=0;i<160;i++) parts.push({x:cv.width/2,y:cv.height*.38,vx:(Math.random()-.5)*14,vy:Math.random()*-14-3,c:cols[i%4],w:Math.random()*6+4,a:Math.random()*6,life:120+Math.random()*60});
}
function loop(t){
  cx.clearRect(0,0,cv.width,cv.height);
  for(const s of stars){ cx.globalAlpha=.4+.4*Math.sin(t/700+s.t); cx.fillStyle="#eef1ff"; cx.beginPath(); cx.arc(s.x,s.y,s.r,0,7); cx.fill(); }
  cx.globalAlpha=1;
  parts = parts.filter(p=>p.life-->0);
  for(const p of parts){ p.vy+=.35; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.a+=.2; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.fillStyle=p.c; cx.fillRect(-p.w/2,-p.w/4,p.w,p.w/2); cx.restore(); }
  requestAnimationFrame(loop);
}

$("again").addEventListener("click", boom);

addEventListener("resize", size);
size(); render(); setInterval(render, 1000);
showSpruch(calendarDays(new Date()) % SPRUECHE.length);
requestAnimationFrame(loop);
setTimeout(boom, 250);
</script>
</body>
</html>
